name: drivalry
description: "Drivalry: the friendly-rivalry driving app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  collection: ^1.19.1
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  drivalry_packs:
    path: ../packages/drivalry_packs
  drivalry_scoring:
    path: ../packages/drivalry_scoring
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_tts: ^4.2.5
  go_router: ^17.5.0
  google_maps_flutter: ^2.18.1
  http: ^1.6.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  sqlite3: ^3.5.2
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
