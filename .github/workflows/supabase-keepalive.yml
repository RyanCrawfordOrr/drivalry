name: Supabase keep-alive

# Free-tier Supabase projects pause after seven days of low database activity.
# One table read a day keeps ours awake. Only the public URL and publishable
# key are needed. Secrets: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Auth liveness
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "auth health: $code"
          test "$code" = "200"

      - name: Database activity
        run: |
          # Reads the one-row table from supabase/migrations/0000_heartbeat.sql.
          # This is the step that prevents pausing.
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$SUPABASE_URL/rest/v1/heartbeat?select=id&limit=1" -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "rest heartbeat: $code"
          test "$code" = "200"
