name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: TypeScript scoring spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  dart:
    name: Dart scoring port
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/drivalry_scoring
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  packs-dart:
    name: Dart pack reader and matcher
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/drivalry_packs
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  packs-python:
    name: Python pack builder
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/packs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/packs/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
